name: Publish to PyPI

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
      contents: write   # create and push the version tag

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history so we can see existing tags

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Read version from pyproject.toml
      id: version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check whether this version is already tagged
      id: tagcheck
      run: |
        if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Version v${{ steps.version.outputs.version }} already tagged — skipping publish."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.tagcheck.outputs.exists == 'false'
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish to PyPI
      if: steps.tagcheck.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Tag the released version
      if: steps.tagcheck.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.version.outputs.version }}" -m "New version: v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
